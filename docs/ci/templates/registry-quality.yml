name: AART registry quality

# Template — copy to `.github/workflows/aart-registry.yml` in a registry repository.
#
# Self-contained on purpose: one file, one marketplace action, no pip, no package index, and no
# build backend.  AART has no runtime dependencies and ships `agent_artifacts/__main__.py`, so a
# source tree plus PYTHONPATH is a working installation.  That is what makes a registry's quality
# gates runnable on a private runner with no egress.
#
# Set as repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#
#   AART_TOOL_PATH   an agent-artifacts tree baked into the CI image, e.g. /opt/aart.
#                    Set this and the job needs neither git nor the network for the tool.
#   AART_TOOL_URL    otherwise, the Git URL of your agent-artifacts fork,
#                    e.g. https://ghe.example.com/platform/agent-artifacts.git
#   AART_TOOL_REF    the tag to pin, e.g. v2.8.5.  Move this in one place, not in three files.
#   AART_RUNNER      JSON array of runner labels, e.g. ["self-hosted","linux","x64"]
#   AART_CI_IMAGE    optional container image for the job, e.g. registry.example.com/ci/python:3.12
#   AART_PYTHON      interpreter name in that image, default python3
#
# Leave every variable unset and this runs on github.com hosted runners against public AART.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry-quality:
    runs-on: ${{ fromJSON(vars.AART_RUNNER || '["ubuntu-latest"]') }}
    container: ${{ vars.AART_CI_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        compatibility: [minimum, latest]
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Provide AART
        env:
          TOOL_PATH: ${{ vars.AART_TOOL_PATH }}
          TOOL_URL: ${{ vars.AART_TOOL_URL || 'https://github.com/M1F1/agent-artifacts.git' }}
          TOOL_REF: ${{ vars.AART_TOOL_REF || 'v2.8.5' }}
          PY: ${{ vars.AART_PYTHON || 'python3' }}
        run: |
          set -euo pipefail
          tool="$TOOL_PATH"
          if [ -z "$tool" ]; then
            tool="${RUNNER_TEMP}/aart-tool"
            rm -rf "$tool"
            git clone --quiet --depth 1 --branch "$TOOL_REF" "$TOOL_URL" "$tool" 2>/dev/null \
              || { rm -rf "$tool"
                   git clone --quiet "$TOOL_URL" "$tool"
                   git -C "$tool" -c advice.detachedHead=false checkout --quiet "$TOOL_REF"; }
          fi
          test -f "$tool/agent_artifacts/__main__.py" \
            || { echo "aart: no agent_artifacts package under '$tool'" >&2; exit 2; }
          bin="${RUNNER_TEMP}/aart-bin"
          mkdir -p "$bin"
          cat > "$bin/aart" <<SHIM
          #!/usr/bin/env bash
          exec env PYTHONPATH="$tool" "$PY" -m agent_artifacts "\$@"
          SHIM
          chmod +x "$bin/aart"
          echo "$bin" >> "$GITHUB_PATH"
          # The version that answered, printed by the copy that will run the gates.  A pin that
          # silently did not move is a real finding in this project's history; this line is the
          # cheapest protection against repeating it, and it is what a reviewer reads.
          echo "AART: $("$bin/aart" --version)  from $tool"

      - run: aart registry format --source . --check
      - run: aart registry validate --source . --strict --frozen
      - run: aart registry lock --source . --check
      - run: aart registry build --source . --check
      - run: aart registry audit --source .
      - run: aart registry test --source . --compatibility ${{ matrix.compatibility }}
