name: AART release checklist
description: >
  Reconcile against the reference registry, prove the tag, build the offline wheel and ship it.
  Lives in an action for the same reason the quality gates do: two jobs differ only in how their
  container image is pulled, and a release checklist duplicated is a release checklist that drifts.

inputs:
  python:
    description: Name of the interpreter to invoke.
    required: true
  python-version:
    description: Interpreter version to install when the job runs without a container image.
    required: true
  setup-python:
    description: '"true" when the job has no container image and so needs an interpreter installed.'
    required: true
  tag:
    description: The release tag under inspection.
    required: true
  artifact-v4:
    description: '"true" when the instance supports the v4 artifact protocol.'
    required: true

runs:
  using: composite
  steps:
    # The release steps read history through git, so they need the same trust the quality action
    # establishes.  See the note there.
    - name: Trust the checked-out workspace
      shell: bash
      # `$PWD`, not `$GITHUB_WORKSPACE`: a composite step starts in the repository root
      # anyway, and the shell guarantees `$PWD` is set to it.  An unset environment
      # variable would expand to an empty path, which git accepts and which fixes
      # nothing -- a silent no-op is the worst outcome for a step like this.
      run: git config --global --add safe.directory "$PWD"

    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # Unset means this fork keeps no artifact catalogue, so there is nothing to reconcile against
    # and nothing to clone.  The variable is the switch; there is no second one to remember.
    - name: Clone approved reference registry
      if: env.REFERENCE_REGISTRY_URL != ''
      shell: bash
      run: git clone --depth 1 "$REFERENCE_REGISTRY_URL" "$RUNNER_TEMP/reference-registry"

    - name: Prove the tagged source was merged into main
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
        git merge-base --is-ancestor "$TAG_COMMIT" origin/main

    # `--without-registry` is typed out rather than inferred from a missing `--registry`, so a
    # release that verifies less can only happen on purpose.  The checklist warns on every such
    # run and marks the seven registry checks `skipped`, never `passed`.
    - name: Run stable release checklist
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${REFERENCE_REGISTRY_URL:-}" ]; then
          ${{ inputs.python }} scripts/release.py check --registry "$RUNNER_TEMP/reference-registry"
        else
          ${{ inputs.python }} scripts/release.py check --without-registry
        fi

    - name: Verify source version and release tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: ${{ inputs.python }} scripts/version.py check-tag "$TAG"

    - name: Verify reviewed release notes
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: test -s "docs/release/github-release-${TAG}.md"

    - name: Inject commit
      shell: bash
      run: ${{ inputs.python }} scripts/inject_commit.py

    - name: Build wheel
      shell: bash
      run: ${{ inputs.python }} scripts/build_wheel.py

    # The step appears twice for the reason `container.credentials` does in validate.yml: the
    # thing that has to change is `uses:`, and `uses:` cannot contain an expression.  So the
    # choice moves to where a choice survives -- `if:` -- and both spellings sit in the file.
    #
    # This is not a version preference.  A GitHub Enterprise Server instance ships
    # `upload-artifact@v4` and downloads it happily, then fails at run time:
    #
    #     GHESNotSupportedError: @actions/artifact v2.0.0+, upload-artifact@v4+ and
    #     download-artifact@v4+ are not currently supported on GHES.
    #
    # The action is present; the instance's artifact backend does not speak the protocol that
    # version uses.  Measured on a real instance, which is the only place it could be measured.
    - name: Upload wheel artifact
      if: inputs.artifact-v4 == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: wheel
        path: dist/*.whl
        if-no-files-found: error

    - name: Upload wheel artifact (instance artifact protocol)
      if: inputs.artifact-v4 != 'true'
      uses: actions/upload-artifact@v3
      with:
        name: wheel
        path: dist/*.whl
        if-no-files-found: error

    # The GitHub CLI is not installed in every CI image -- a real Enterprise image had Python, git
    # and an internal index and no `gh`, so this step failed after the wheel was already built.
    # The REST API needs only `curl` and the interpreter already running everything else, so the
    # tool comes off the list of things an image has to carry, the same way GNU Make did.
    #
    # It also removes a hazard `gh` brought with it: `gh` talks to github.com unless `GH_HOST` says
    # otherwise, so an unset `AART_GH_HOST` pointed a fork's upload at the wrong instance
    # entirely.  `GITHUB_API_URL` is set by the runner and is always this instance, and the upload
    # host is read from the release itself rather than guessed.
    - name: Attach wheel to release
      if: github.event_name == 'release'
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        wheel="$(ls dist/*.whl)"
        name="$(basename "$wheel")"
        api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
        auth=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")
        release="$(curl -fsSL "${auth[@]}" "$api/releases/tags/$TAG")"

        # One reading of the release answers both questions: which asset of this name already
        # exists, and where uploads go.  The upload host is its own hostname on an Enterprise
        # instance, so it is read from the release rather than assembled; `{?name,label}` is the
        # URI template suffix and is dropped.
        facts="$(printf '%s' "$release" | ${{ inputs.python }} -c 'import json,sys;r=json.load(sys.stdin);n=sys.argv[1];print(next((x["id"] for x in r["assets"] if x["name"]==n),""));print(r["upload_url"].split("{")[0])' "$name")"
        existing="$(printf '%s' "$facts" | head -n 1)"
        upload="$(printf '%s' "$facts" | tail -n 1)"

        # This is what `--clobber` was doing: replace an asset of the same name rather than fail
        # on it, so re-running a release is not a dead end.
        if [ -n "$existing" ]; then
          curl -fsS -X DELETE "${auth[@]}" "$api/releases/assets/$existing" >/dev/null
        fi
        curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/octet-stream" \
          --data-binary "@$wheel" "$upload?name=$name" >/dev/null
        echo "attached $name to $TAG"
