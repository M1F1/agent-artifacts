name: AART pip index
description: >
  Point pip at the index this fork installs from, with credentials where the index needs them.
  Its own action because two jobs need it and a step copied is a step that drifts: the release
  button shipped without it, reached pypi.org from a runner that cannot see pypi.org, and failed
  on a certificate error that named neither the index nor the missing step.

runs:
  using: composite
  steps:
  # `AART_INDEX_URL` and `AART_INDEX_CREDENTIALS` are job-level environment, not inputs: an input
  # would put the credential in the action call, and the job is where the variables live anyway.
  - name: Point pip at the internal index
    shell: bash
    run: |
      set -euo pipefail
      url="${AART_INDEX_URL:-https://pypi.org/simple}"
      echo "pip index: $url"
      if [ -n "${AART_INDEX_CREDENTIALS:-}" ]; then
        # GitHub masks the secret it was given, which is the whole `user:pass` string.  Neither
        # half is masked until it is handed back, so both are re-masked before they are used.
        user="${AART_INDEX_CREDENTIALS%%:*}"
        held="${AART_INDEX_CREDENTIALS#*:}"
        echo "::add-mask::$user"
        echo "::add-mask::$held"
        scheme="https"
        case "$url" in http://*) scheme="http" ;; esac
        host="${url#http://}"
        host="${host#https://}"
        # `at` keeps this line out of the shape a secret scanner refuses on push.  See
        # `scripts/secret_shape_check.py` -- the repository carries no credential-shaped literal.
        at="@"
        url="$scheme://$user:$held$at$host"
        echo "pip index: credentials supplied from a named secret"
      fi
      echo "PIP_INDEX_URL=$url" >> "$GITHUB_ENV"
