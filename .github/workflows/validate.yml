name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install developer quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run canonical quality gates
        run: make quality
