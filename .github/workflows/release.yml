name: release

# Repeats quality/release gates, builds the offline zero-dependency wheel, and ships it.
# Triggers for the fixed 1.0.0 contract:
#   * v1.0.0 tag push                   -> build + upload as a workflow artifact
#   * a published v1.0.0 GitHub release -> additionally attach the wheel to the release
on:
  push:
    tags:
      - "v1.0.0"
  release:
    types: [published]

permissions:
  contents: write  # required to attach assets to the release

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
          - python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install developer quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run canonical quality gates
        run: make quality

  release:
    if: github.event_name == 'push' || github.event.release.tag_name == 'v1.0.0'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone approved public reference registry
        run: git clone --depth 1 https://github.com/M1F1/agent-artifacts-registry.git "$RUNNER_TEMP/reference-registry"

      - name: Prove the tagged source was merged into main
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Run stable release checklist
        run: make release-check REGISTRY="$RUNNER_TEMP/reference-registry"

      - name: Verify source version and release tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python scripts/version.py check-tag "$TAG"

      - name: Verify reviewed release notes
        run: test -s docs/release/github-release-v1.0.0.md

      - name: Inject commit
        run: python scripts/inject_commit.py

      - name: Build wheel
        run: python scripts/build_wheel.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Attach wheel to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.whl --clobber
