name: release

# Repeats quality/release gates, builds the offline zero-dependency wheel, and ships it.
# Triggers:
#   * a stable vX.Y.Z tag push          -> build + upload as a workflow artifact
#   * a published GitHub release        -> additionally attach the wheel to the release
# `scripts/version.py check-tag` is the real gate: it rejects any tag that does not match the
# source version the release contract governs, so the pattern below stays deliberately broad
# rather than pinning one release and silently building nothing for the next.
#
# Portable to a GitHub Enterprise Server fork by setting repository variables only; every default
# reproduces the public github.com run.  See docs/ci/enterprise-fork-v1.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]

permissions:
  contents: write  # required to attach assets to the release

jobs:
  quality:
    runs-on: ${{ fromJSON(vars.AART_RUNNER || '["ubuntu-latest"]') }}
    container: ${{ vars.AART_CI_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(vars.AART_PYTHON_VERSIONS || '["3.10", "3.14"]') }}
    env:
      PIP_INDEX_URL: ${{ vars.AART_PIP_INDEX_URL || 'https://pypi.org/simple' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: vars.AART_CI_IMAGE == ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install developer quality tools
        run: ${{ vars.AART_PYTHON || 'python' }} -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run canonical quality gates
        run: make quality PYTHON=${{ vars.AART_PYTHON || 'python' }}

  release:
    needs: quality
    runs-on: ${{ fromJSON(vars.AART_RUNNER || '["ubuntu-latest"]') }}
    container: ${{ vars.AART_CI_IMAGE }}
    env:
      PIP_INDEX_URL: ${{ vars.AART_PIP_INDEX_URL || 'https://pypi.org/simple' }}
      # The release checklist reconciles against a real registry checkout.  A fork points this at
      # the registry it actually publishes, which is not this project's reference registry.
      REFERENCE_REGISTRY_URL: ${{ vars.AART_REFERENCE_REGISTRY_URL || 'https://github.com/M1F1/agent-artifacts-registry.git' }}
      # `gh` talks to github.com unless told otherwise; on GHES it needs the instance hostname.
      GH_HOST: ${{ vars.AART_GH_HOST || 'github.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: vars.AART_CI_IMAGE == ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.AART_RELEASE_PYTHON_VERSION || '3.11' }}

      - name: Clone approved reference registry
        run: git clone --depth 1 "$REFERENCE_REGISTRY_URL" "$RUNNER_TEMP/reference-registry"

      - name: Prove the tagged source was merged into main
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Run stable release checklist
        run: make release-check REGISTRY="$RUNNER_TEMP/reference-registry" PYTHON=${{ vars.AART_PYTHON || 'python' }}

      - name: Verify source version and release tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: ${{ vars.AART_PYTHON || 'python' }} scripts/version.py check-tag "$TAG"

      - name: Verify reviewed release notes
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: test -s "docs/release/github-release-${TAG}.md"

      - name: Inject commit
        run: ${{ vars.AART_PYTHON || 'python' }} scripts/inject_commit.py

      # The wheel carries where it was built from, so `registry init` can stamp a registry's CI
      # without knowing how the wheel arrived.  Both values come from this job's own context, so a
      # fork stamps its own instance and its own repository with no edit to this file.
      - name: Inject build origin
        env:
          AART_BUILD_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          AART_BUILD_REF: ${{ github.event.release.tag_name || github.ref_name }}
        run: ${{ vars.AART_PYTHON || 'python' }} scripts/inject_build_origin.py

      - name: Build wheel
        run: ${{ vars.AART_PYTHON || 'python' }} scripts/build_wheel.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Attach wheel to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.whl --clobber
